version: "3.9"

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - .env.backend
    ports:
      - "8000:8000"
    networks:
      - web

  frontend:
    build:
      context: ../../frontend/web
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - web

networks:
  web:
    driver: bridge
