services:
  # Local Redis (optional - comment out if using Redis Cloud)
  # redis:
  #   image: redis:7-alpine
  #   container_name: ringshell-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --appendonly yes
  #   restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # single env: x86_64 everywhere
      # Docker Desktop on M* will emulate via Rosetta
      # Cloud will run natively
      platforms:
        - linux/amd64
    container_name: ringshell-backend
    environment:
      # Python Configuration
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # Redis Configuration - Use .env file values for Redis Cloud
      - RINGSHELL_REDIS_HOST=${RINGSHELL_REDIS_HOST:-redis}
      - RINGSHELL_REDIS_PORT=${RINGSHELL_REDIS_PORT:-6379}
      - RINGSHELL_REDIS_USERNAME=${RINGSHELL_REDIS_USERNAME:-}
      - RINGSHELL_REDIS_PASSWORD=${RINGSHELL_REDIS_PASSWORD:-}
      # API Keys
      - RINGSHELL_FMP_API_KEY=${RINGSHELL_FMP_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      # LangSmith Configuration
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-ringshell}
    volumes:
      - ./backend:/app
    # depends_on:
    #   - redis  # Commented out - using Redis Cloud instead
    stdin_open: true
    tty: true
    working_dir: /app
    # Uncomment to expose API port
    # ports:
    #   - "8000:8000"

  # ctp-service:
  #   build:
  #     context: ./ctp
  #     dockerfile: Dockerfile
  #     platforms:
  #       - linux/amd64
  #   container_name: ctp-service
  #   environment:
  #     - CTP_BROKER_ID=${CTP_BROKER_ID}
  #     - CTP_USER_ID=${CTP_USER_ID}
  #     - CTP_PASSWORD=${CTP_PASSWORD}
  #     - CTP_MD_SERVER=tcp://118.143.139.137:31213
  #     - CTP_TRADE_SERVER=tcp://118.143.139.137:31205
  #     - CTP_REQUIRE_AUTH=${CTP_REQUIRE_AUTH:-false}
  #     # optional, add later when available
  #     - CTP_APP_ID=${CTP_APP_ID}
  #     - CTP_AUTH_CODE=${CTP_AUTH_CODE}
  #   ports:
  #     - "8080:8080"

volumes:
  redis_data:
    driver: local
